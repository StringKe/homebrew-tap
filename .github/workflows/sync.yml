name: sync

on:
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch:
    inputs:
      version:
        description: "版本号（留空取最新 release）"
        required: false
        default: ""

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Regenerate formulae
        run: |
          version="${{ github.event.inputs.version }}"
          scripts/sync.sh tomato-cli "$version"
          scripts/sync.sh stdagent "$version"
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Formula/tomato-cli.rb Formula/stdagent.rb
          git diff --cached --quiet && exit 0
          git commit -m "chore(formula): 同步 formulae"
          git push
